service: defendershield-etl
schedule: "15 11 * * *"
stages:
  - name: etl-pipeline
    type: docker-exec
    container: etl-scheduler
    command: "python -m defendershield_etl.pipelines.daily_runner --catchup"
    timeout: 3600
  - name: data-health
    type: docker-exec
    container: etl-scheduler
    command: "pytest tests/test_data_health.py -m 'integration and not opsdrift' -v --tb=short"
    depends_on: [etl-pipeline]
    timeout: 120
  - name: ops-drift
    type: docker-exec
    container: etl-scheduler
    # Client-side process drift, NOT pipeline correctness. Split out of data-health
    # so a standing client backlog (e.g. warehouse->3PL transfers awaiting a manual
    # SkuVault adjustment) cannot leave data-health permanently red and train
    # everyone to ignore the one signal that means WE broke something.
    # A failure here is actionable by DefenderShield ops, not by us.
    # Emails the finding table to the ops list and exits non-zero when there is
    # anything outstanding, so the alert survives a broken mailbox.
    command: "python -m defendershield_etl.reports.transfer_drift"
    depends_on: [etl-pipeline]
    timeout: 120
  - name: catalog-spine
    type: docker-exec
    container: etl-scheduler
    # Cross-system catalogue disagreements: a product on the website that the 3PL
    # has never heard of, a UPC that differs between Shopify and Amazon, a listing
    # that lost its variation parent. Modelled on ops-drift and split from it for
    # the same reason: these are findings about the client's catalogue, not about
    # whether our pipeline is correct, and a standing backlog of them must not be
    # able to turn data-health permanently red.
    # Depends on etl-pipeline so the ShipMonk and catalogue pulls are fresh. If any
    # source did not land, it reports that it skipped and compares nothing: a
    # partial comparison invents hundreds of false absences.
    # Findings do NOT fail the stage while SPINE_FAIL_ON_FINDINGS is off, which is
    # the default: a new check starts with a large untriaged backlog and a stage
    # that is red from day one gets muted within a week. The email is the signal.
    # Turn the flag on once the backlog is small enough that red means something
    # changed. A source that failed to land always fails the stage regardless.
    # Nothing depends on this stage, so its failure reaches nothing.
    command: "python -m defendershield_etl.reports.catalog_spine"
    depends_on: [etl-pipeline]
    timeout: 300
  - name: amazon-report-validation
    type: docker-exec
    container: etl-scheduler
    # Compares the Amazon All Orders report snapshot with the Orders API feed:
    # price drift, cancelled-vs-shipped, lines missing from either side, and
    # Pending report prices that differ from the settled price (the check the
    # Monday brief will depend on; SPEC-monday-reports.md in defendershield-etl).
    # Ops-only email, non-zero on any finding or when today's report pull did
    # not land. Nothing depends on this stage, so it never blocks sales, the
    # forecast or the client reports.
    command: "python -m defendershield_etl.reports.amazon_report_validation"
    depends_on: [etl-pipeline]
    timeout: 120
  - name: weekly-report
    type: docker-exec
    container: etl-scheduler
    command: "python -m defendershield_etl.reports.weekly"
    depends_on: [data-health]
    condition: etl-pipeline.success
    # Runs Monday for the week that ended the day before. Amazon's Orders API
    # withholds price while an order is Pending, which is why this used to wait
    # until Thursday; the All Orders report now supplies that price at order time
    # (SPEC-monday-reports.md in defendershield-etl).
    # Mon-Thu, not Monday alone: the report refuses to send when that morning's
    # All Orders pull failed, and retries the next day. bronze.client_report_log
    # keeps the client to one copy per week, so the extra days are no-ops once the
    # brief has gone out. Exit 3 means "not reportable yet", not "broken".
    when: [mon, tue, wed, thu]
    timeout: 120
  - name: monthly-report
    type: docker-exec
    container: etl-scheduler
    command: "python -m defendershield_etl.reports.monthly"
    depends_on: [data-health]
    condition: etl-pipeline.success
    # Runs on the 1st for the month just ended, for the same reason the weekly
    # brief moved to Monday. The 1st through the 5th are retry days, not five
    # sends: bronze.client_report_log keeps the client to one copy per month.
    when_day_of_month: [1, 2, 3, 4, 5]
    timeout: 120
  - name: new-product-report
    type: docker-exec
    container: etl-scheduler
    command: "python -m defendershield_etl.reports.new_product_performance"
    depends_on: [data-health]
    condition: etl-pipeline.success
    timeout: 120
