service: defendershield-etl
schedule: "15 11 * * *"
stages:
  - name: etl-pipeline
    type: docker-exec
    container: etl-scheduler
    command: "python -m defendershield_etl.pipelines.daily_runner --catchup"
    timeout: 3600
  - name: data-health
    type: docker-exec
    container: etl-scheduler
    command: "pytest tests/test_data_health.py -m integration -v --tb=short"
    depends_on: [etl-pipeline]
    timeout: 120
  - name: weekly-report
    type: docker-exec
    container: etl-scheduler
    command: "python -m defendershield_etl.reports.weekly"
    depends_on: [data-health]
    condition: etl-pipeline.success
    # Delayed from Monday to Thursday so the reported Mon-Sun week's tail
    # (Sat/Sun) has aged >=4 days and Amazon Pending orders have priced.
    # Date window is anchored to the most-recent complete week, so the run
    # day only changes freshness, not which week is reported. See
    # RECONCILIATION_FINDINGS: pending-order pricing lag (~90% by day 2-3).
    when: [thu]
    timeout: 120
  - name: monthly-report
    type: docker-exec
    container: etl-scheduler
    command: "python -m defendershield_etl.reports.monthly"
    depends_on: [data-health]
    condition: etl-pipeline.success
    # Delayed from the 1st to the 5th so the prior month's last 1-2 days have
    # aged >=4 days and Amazon Pending orders have priced. Date window is
    # anchored to the prior calendar month, so the run day only changes
    # freshness, not which month is reported.
    when_day_of_month: [5]
    timeout: 120
  - name: new-product-report
    type: docker-exec
    container: etl-scheduler
    command: "python -m defendershield_etl.reports.new_product_performance"
    depends_on: [data-health]
    condition: etl-pipeline.success
    timeout: 120
